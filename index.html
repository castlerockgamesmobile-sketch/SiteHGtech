<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sua Empresa | Soluções Digitais</title>
  <style>
    body { font-family: 'Roboto', sans-serif; background-color: #0f172a; color: #f1f5f9; }
    header { background: #1e293b; padding: 1rem 2rem; position: sticky; top: 0; }
    nav { display: flex; justify-content: space-between; align-items: center; }
    nav .logo { font-size: 1.5rem; font-weight: bold; color: #38bdf8; }
    nav .menu { list-style: none; display: flex; gap: 1.5rem; }
    nav .menu a { color: #f1f5f9; text-decoration: none; cursor: pointer; }
    nav .menu a:hover { color: #38bdf8; }
    .link-desc { 
      display: none; 
      font-size: 0.9rem; 
      color: #94a3b8; 
      margin-top: 0.3rem; 
      opacity: 0; 
      transition: opacity 0.5s ease; 
    }
    .link-desc.show { display: block; opacity: 1; }

    section { padding: 3rem 2rem; max-width: 1200px; margin: auto; }
    h2 { text-align: center; color: #38bdf8; margin-bottom: 2rem; }
    #servicos .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.5rem; }
    .card { background: #1e293b; padding: 2rem; border-radius: 8px; text-align: center; cursor: pointer; }
    .card:hover { background: #0ea5e9; color: #0f172a; }
    .descricao { 
      display: none; 
      margin-top: 1rem; 
      font-size: 0.95rem; 
      opacity: 0; 
      transition: opacity 0.5s ease; 
    }
    .descricao.show { display: block; opacity: 1; }

    footer { text-align: center; padding: 2rem; background: #1e293b; color: #94a3b8; }
  </style>
</head>
<body>
  <header>
    <nav>
      <div class="logo">Sua Empresa</div>
      <ul class="menu">
        <li>
          <a data-desc="Conheça nossa história e valores.">Sobre</a>
          <div class="link-desc"></div>
        </li>
        <li>
          <a data-desc="Veja os serviços que oferecemos.">Serviços</a>
          <div class="link-desc"></div>
        </li>
        <li>
          <a data-desc="Confira nossos projetos de sucesso.">Cases</a>
          <div class="link-desc"></div>
        </li>
        <li>
          <a data-desc="Leia o que nossos clientes dizem.">Depoimentos</a>
          <div class="link-desc"></div>
        </li>
        <li>
          <a data-desc="Acesse nossos artigos e insights.">Blog</a>
          <div class="link-desc"></div>
        </li>
        <li>
          <a data-desc="Entre em contato conosco.">Contato</a>
          <div class="link-desc"></div>
        </li>
      </ul>
    </nav>
  </header>

  <section id="servicos">
    <h2>Nossos Serviços</h2>
    <div class="grid">
      <div class="card" data-desc="Criamos softwares personalizados para sua empresa.">Software Development<div class="descricao"></div></div>
      <div class="card" data-desc="Aplicativos móveis modernos e escaláveis.">Mobile App Development<div class="descricao"></div></div>
      <div class="card" data-desc="Sites responsivos e design inovador.">Web Design & Development<div class="descricao"></div></div>
      <div class="card" data-desc="Soluções de inteligência artificial sob medida.">AI Solutions<div class="descricao"></div></div>
      <div class="card" data-desc="Infraestrutura em nuvem segura e eficiente.">Cloud & Infra<div class="descricao"></div></div>
      <div class="card" data-desc="Testes e garantia de qualidade para seus sistemas.">Testing & QA<div class="descricao"></div></div>
    </div>
  </section>

  <footer>
    <p>&copy; 2026 Sua Empresa. Todos os direitos reservados.</p>
  </footer>

  <script>
    // Links do menu: mostram descrição abaixo com fade-in
    document.querySelectorAll("nav .menu li").forEach(item => {
      const link = item.querySelector("a");
      const descDiv = item.querySelector(".link-desc");
      link.addEventListener("click", () => {
        if (descDiv.classList.contains("show")) {
          descDiv.classList.remove("show");
        } else {
          descDiv.textContent = link.dataset.desc;
          descDiv.classList.add("show");
        }
      });
    });

    // Cards de serviços: mostram descrição abaixo com fade-in
    document.querySelectorAll(".card").forEach(card => {
      const descDiv = card.querySelector(".descricao");
      card.addEventListener("click", () => {
        if (descDiv.classList.contains("show")) {
          descDiv.classList.remove("show");
        } else {
          descDiv.textContent = card.dataset.desc;
          descDiv.classList.add("show");
        }
      });
    });
  </script>
</body>
</html>
